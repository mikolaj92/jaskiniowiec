name: Sync SKILL.md and rules

on:
  push:
    branches: [main]
    paths:
      - skills/jaskiniowiec/SKILL.md
      - rules/jaskiniowiec-activate.md
      - jaskiniowiec-compress/SKILL.md
      - jaskiniowiec-compress/scripts/**

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest before making changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Sync SKILL.md copies
        run: |
          SOURCE="skills/jaskiniowiec/SKILL.md"
          for target in \
            jaskiniowiec/SKILL.md \
            plugins/jaskiniowiec/skills/jaskiniowiec/SKILL.md \
            .cursor/skills/jaskiniowiec/SKILL.md \
            .windsurf/skills/jaskiniowiec/SKILL.md
          do
            mkdir -p "$(dirname "$target")"
            cp "$SOURCE" "$target"
          done

      - name: Sync compress skill
        run: |
          rm -rf skills/compress/scripts
          cp jaskiniowiec-compress/SKILL.md skills/compress/SKILL.md
          sed -i 's/^name: jaskiniowiec-compress$/name: compress/' skills/compress/SKILL.md
          sed -i "s|The compression scripts live in \`jaskiniowiec-compress/scripts/\` (adjacent to this SKILL.md). If the path is not immediately available, search for \`jaskiniowiec-compress/scripts/__main__.py\`.|This SKILL.md lives alongside \`scripts/\` in the same directory. Find that directory.|" skills/compress/SKILL.md
          sed -i 's|cd jaskiniowiec-compress && python3|cd <directory_containing_this_SKILL.md> \&\& python3|' skills/compress/SKILL.md
          cp -r jaskiniowiec-compress/scripts skills/compress/scripts
          rm -rf skills/compress/scripts/__pycache__

      - name: Sync compress skill to plugin
        run: |
          cp jaskiniowiec-compress/SKILL.md plugins/jaskiniowiec/skills/compress/SKILL.md
          sed -i 's/^name: jaskiniowiec-compress$/name: compress/' plugins/jaskiniowiec/skills/compress/SKILL.md
          sed -i "s|The compression scripts live in \`jaskiniowiec-compress/scripts/\` (adjacent to this SKILL.md). If the path is not immediately available, search for \`jaskiniowiec-compress/scripts/__main__.py\`.|This SKILL.md lives alongside \`scripts/\` in the same directory. Find that directory.|" plugins/jaskiniowiec/skills/compress/SKILL.md
          sed -i 's|cd jaskiniowiec-compress && python3|cd <directory_containing_this_SKILL.md> \&\& python3|' plugins/jaskiniowiec/skills/compress/SKILL.md
          rm -rf plugins/jaskiniowiec/skills/compress/scripts
          cp -r jaskiniowiec-compress/scripts plugins/jaskiniowiec/skills/compress/scripts
          rm -rf plugins/jaskiniowiec/skills/compress/scripts/__pycache__

      - name: Rebuild jaskiniowiec.skill ZIP
        run: cd skills && zip -r ../jaskiniowiec.skill jaskiniowiec/

      - name: Sync auto-activation rules
        run: |
          BODY="rules/jaskiniowiec-activate.md"
          mkdir -p .clinerules .github
          cp "$BODY" .clinerules/jaskiniowiec.md
          cp "$BODY" .github/copilot-instructions.md

          mkdir -p .cursor/rules
          printf '%s\n' '---' 'description: "Jaskiniowiec mode — terse communication, ~75% fewer tokens, full technical accuracy"' 'alwaysApply: true' '---' '' > .cursor/rules/jaskiniowiec.mdc
          cat "$BODY" >> .cursor/rules/jaskiniowiec.mdc

          mkdir -p .windsurf/rules
          printf '%s\n' '---' 'trigger: always_on' '---' '' > .windsurf/rules/jaskiniowiec.md
          cat "$BODY" >> .windsurf/rules/jaskiniowiec.md

      - name: Commit and push if changed
        run: |
          git add \
            jaskiniowiec/SKILL.md \
            skills/compress/ \
            plugins/jaskiniowiec/skills/compress/ \
            plugins/jaskiniowiec/skills/jaskiniowiec/SKILL.md \
            .cursor/skills/jaskiniowiec/SKILL.md \
            .windsurf/skills/jaskiniowiec/SKILL.md \
            jaskiniowiec.skill \
            .clinerules/jaskiniowiec.md \
            .github/copilot-instructions.md \
            .cursor/rules/jaskiniowiec.mdc \
            .windsurf/rules/jaskiniowiec.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync SKILL.md copies and auto-activation rules [skip ci]"
          git push
